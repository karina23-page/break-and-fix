{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h1>Add Scene 🎥</h1>

    <p class="form-subtitle">

        {{ movie.title }}

    </p>

    <form
        method="POST"
        enctype="multipart/form-data">

        <label>Scene Title</label>

        <input
            type="text"
            name="title"
            required>

        <label>Scene Image</label>

        <input
            type="file"
            name="image"
            accept="image/*"
            required>

        <label>Description</label>

        <textarea
            name="description"
            rows="10"
            required></textarea>

        <button
            type="submit"
            class="primary-button">

            Save Scene

        </button>

    </form>

</div>

{% endblock %}
