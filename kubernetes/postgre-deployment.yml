apiVersion: apps/v1
kind: Deployment

metadata:
   name: postgre
   namespace: movie-space

spec:
  replicas: 1


  selector:
    matchLabels:
      app: postgre


  template:
    metadata:
      labels: 
        app: postgre

    spec:
      containers:

      - name: postgre

        image: postgres:16

        ports:
        - containerPort: 5432


        env:
        - name: POSTGRES_USER
          valueFrom:
             secretKeyRef:
                name: postgre-secret
                key: DB_USER

        - name: POSTGRES_PASSWORD
          valueFrom:
             secretKeyRef:
                name: postgre-secret
                key: DB_PASSWORD

        - name: POSTGRES_DB
          value: movie_database