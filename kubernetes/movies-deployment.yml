apiVersion: apps/v1
kind: Deployment

metadata:
   name: movie-app
   namespace: movie-space
   
spec:
    replicas: 2 

    selector:
       matchLabels: 
          app: movie-app


    template:
      metadata:
        labels:
          app: movie-app

      spec:
        containers:
          - name: movie-app

            image: tprff2301/movie-app:latest

            ports: 
            - containerPort: 5000

            readinessProbe:
              httpGet:
                path: /nonexistent-ready
                port: 5000
              initialDelaySeconds: 5
              periodSeconds: 5
            livenessProbe:
              httpGet:
                path: /nonexistent-live
                port: 5000
              initialDelaySeconds: 10
              periodSeconds: 5
              
            envFrom:
            - configMapRef: 
                name: movie-conf
            - secretRef:
                name: postgre-secret


